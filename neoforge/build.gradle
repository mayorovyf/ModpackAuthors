plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

def commonDir = file('../common')
def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
sharedProperties.each { key, value ->
    if (!rootProject.ext.has(key.toString())) {
        rootProject.ext.set(key.toString(), value)
    }
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-${rootProject.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())

sourceSets.main.java.srcDirs = [
        'src/main/java',
        "${commonDir}/src/main/java"
]

sourceSets.main.resources {
    srcDir("${commonDir}/src/main/resources")
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
}

def replaceProperties = [
        minecraft_version      : rootProject.minecraft_version,
        minecraft_version_range: rootProject.minecraft_version_range,
        neo_version            : rootProject.neoforge_version,
        loader_version_range   : rootProject.neoforge_loader_version_range,
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_license            : rootProject.mod_license,
        mod_version            : rootProject.mod_version,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : rootProject.mod_id,
                'Specification-Vendor'    : rootProject.mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : rootProject.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Mod-Loader'              : 'neoforge',
                'Minecraft-Version'       : rootProject.minecraft_version,
                'Mod-Version'             : rootProject.mod_version
        ])
    }

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = rootProject.java_version.toInteger()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: '../gradle/dev-run-config.gradle'
