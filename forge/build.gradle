plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def commonDir = file('../common')
def generatedLegacyCommonDir = file("$buildDir/generated/sources/legacyCommon/java")
def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
sharedProperties.each { key, value ->
    if (!rootProject.ext.has(key.toString())) {
        rootProject.ext.set(key.toString(), value)
    }
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-${rootProject.minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())

def legacyCommonPackageReplacements = [
        'com.mojang.blaze3d.vertex.PoseStack'                     : 'com.mojang.blaze3d.matrix.MatrixStack',
        'net.minecraft.Util'                                      : 'net.minecraft.util.Util',
        'net.minecraft.client.gui.screens.ConfirmLinkScreen'      : 'net.minecraft.client.gui.screen.ConfirmOpenLinkScreen',
        'net.minecraft.client.gui.components.events.GuiEventListener': 'net.minecraft.client.gui.IGuiEventListener',
        'net.minecraft.client.gui.components.ObjectSelectionList'  : 'net.minecraft.client.gui.widget.list.ExtendedList',
        'net.minecraft.client.gui.components.AbstractWidget'       : 'net.minecraft.client.gui.widget.Widget',
        'net.minecraft.client.gui.components.EditBox'              : 'net.minecraft.client.gui.widget.TextFieldWidget',
        'net.minecraft.client.gui.components.Button'               : 'net.minecraft.client.gui.widget.button.Button',
        'net.minecraft.client.gui.screens.TitleScreen'             : 'net.minecraft.client.gui.screen.MainMenuScreen',
        'net.minecraft.client.gui.screens.Screen'                  : 'net.minecraft.client.gui.screen.Screen',
        'net.minecraft.client.gui.GuiComponent'                    : 'net.minecraft.client.gui.AbstractGui',
        'net.minecraft.client.gui.Font'                            : 'net.minecraft.client.gui.FontRenderer',
        'net.minecraft.network.chat.TextComponent'                 : 'net.minecraft.util.text.StringTextComponent',
        'net.minecraft.network.chat.TranslatableComponent'         : 'net.minecraft.util.text.TranslationTextComponent',
        'net.minecraft.network.chat.Component'                     : 'net.minecraft.util.text.ITextComponent',
        'net.minecraft.resources.ResourceLocation'                 : 'net.minecraft.util.ResourceLocation',
        'net.minecraft.server.packs.resources.ResourceManager'     : 'net.minecraft.resources.IResourceManager',
        'net.minecraft.server.packs.resources.Resource'            : 'net.minecraft.resources.IResource',
        'net.minecraft.util.FormattedCharSequence'                 : 'net.minecraft.util.IReorderingProcessor',
        'net.minecraft.util.Mth'                                   : 'net.minecraft.util.math.MathHelper'
]

def legacyCommonWordReplacements = [
        'ObjectSelectionList.Entry': 'AbstractList.AbstractListEntry',
        'ConfirmLinkScreen'      : 'ConfirmOpenLinkScreen',
        'ObjectSelectionList'      : 'ExtendedList',
        'GuiEventListener'         : 'IGuiEventListener',
        'AbstractWidget'           : 'Widget',
        'EditBox'                  : 'TextFieldWidget',
        'TitleScreen'              : 'MainMenuScreen',
        'GuiComponent'             : 'AbstractGui',
        'Font'                     : 'FontRenderer',
        'TranslatableComponent'    : 'TranslationTextComponent',
        'TextComponent'            : 'StringTextComponent',
        'Component'                : 'ITextComponent',
        'ResourceLocation'         : 'ResourceLocation',
        'ResourceManager'          : 'IResourceManager',
        'Resource'                 : 'IResource',
        'FormattedCharSequence'    : 'IReorderingProcessor',
        'PoseStack'                : 'MatrixStack',
        'Mth'                      : 'MathHelper'
]

legacyCommonWordReplacements['OnPress'] = 'Button.IPressable'

tasks.register('generateLegacyCommonSources', Copy) {
    outputs.upToDateWhen { false }
    from("${commonDir}/src/main/java") {
        exclude 'com/modpackauthors/data/AuthorCatalogReloadListener.java'
    }
    into generatedLegacyCommonDir
    filter { String line ->
        legacyCommonPackageReplacements.each { from, to ->
            line = line.replace(from, to)
        }
        legacyCommonWordReplacements.each { from, to ->
            line = line.replaceAll("\\b${java.util.regex.Pattern.quote(from)}\\b", to)
        }
        if (line == 'import net.minecraft.client.gui.widget.list.ExtendedList;') {
            line = 'import net.minecraft.client.gui.widget.list.AbstractList;\n' + line
        }
        line
    }
}

sourceSets.main.java.srcDirs = [
        'src/main/java',
        generatedLegacyCommonDir
]

sourceSets.main.resources {
    srcDir("${commonDir}/src/main/resources")
}

minecraft {
    mappings channel: rootProject.mapping_channel, version: rootProject.mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${rootProject.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://libraries.minecraft.net/' }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
}

def replaceProperties = [
        minecraft_version      : rootProject.minecraft_version,
        minecraft_version_range: rootProject.minecraft_version_range,
        forge_version          : rootProject.forge_version,
        forge_version_range    : rootProject.forge_version_range,
        loader_version_range   : rootProject.forge_loader_version_range,
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_license            : rootProject.mod_license,
        mod_version            : rootProject.mod_version,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : rootProject.mod_id,
                'Specification-Vendor'    : rootProject.mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : rootProject.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Mod-Loader'              : 'forge',
                'Minecraft-Version'       : rootProject.minecraft_version,
                'Mod-Version'             : rootProject.mod_version
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('generateLegacyCommonSources')
    options.encoding = 'UTF-8'
    def targetJava = rootProject.java_version.toInteger()
    if (targetJava >= 9) {
        options.release = targetJava
    } else {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

apply from: '../gradle/dev-run-config.gradle'
