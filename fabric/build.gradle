plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'maven-publish'
}

def commonDir = file('../common')
def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
sharedProperties.each { key, value ->
    if (!rootProject.ext.has(key.toString())) {
        rootProject.ext.set(key.toString(), value)
    }
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-${rootProject.minecraft_version}-fabric"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())

sourceSets.main.java.srcDirs = [
        'src/main/java',
        "${commonDir}/src/main/java"
]

sourceSets.main.resources {
    srcDir("${commonDir}/src/main/resources")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

def replaceProperties = [
        minecraft_version             : rootProject.minecraft_version,
        minecraft_version_range       : rootProject.minecraft_version_range,
        fabric_minecraft_version_range: rootProject.fabric_minecraft_version_range,
        fabric_loader_version         : rootProject.fabric_loader_version,
        fabric_loader_version_range   : rootProject.fabric_loader_version_range,
        fabric_api_version            : rootProject.fabric_version,
        mod_id                        : rootProject.mod_id,
        mod_name                      : rootProject.mod_name,
        mod_license                   : rootProject.mod_license,
        mod_version                   : rootProject.mod_version,
        mod_authors                   : rootProject.mod_authors,
        mod_description               : rootProject.mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : rootProject.mod_id,
                'Specification-Vendor'    : rootProject.mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : rootProject.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Mod-Loader'              : 'fabric',
                'Minecraft-Version'       : rootProject.minecraft_version,
                'Mod-Version'             : rootProject.mod_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    def targetJava = rootProject.java_version.toInteger()
    if (targetJava >= 9) {
        options.release = targetJava
    } else {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

apply from: '../gradle/dev-run-config.gradle'
